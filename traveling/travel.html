<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Complete Travel Website Html Css</title>
	<link rel="stylesheet" type="text/css" href="style.css">

	<link rel="stylesheet"
  href="https://unpkg.com/boxicons@latest/css/boxicons.min.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Paytone+One&family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

</head>
<body>	
	<!--header--->
	<header>
		<a href="#" class="logo">Travel</a>
		<div class="bx bx-menu" id="menu-icon"></div>
		

		<ul class="navbar">
			<li><a href="#home">Home</a></li>
			<li><a href="#package">Package</a></li>
			<li><a href="#destination">Destination</a></li>
			<li><a href="#contact">Contact Us</a></li>
		</ul>
		<ul class="navbar">
			<li><a href="index2.html">Login</a></li>
			<li><a href="billing.html">Billing Book</a></li>
		</ul>
	</header>
      
	<!--Home section--->
	<section class="home" id="home">
		<div class="home-text">
			<h1>Shaikh  Travel</h1>
			<p>"The journey of a thousand miles begins with a single step."  <br> TO TRAVEL IS TO LIVE</p>
			
		</div>
	</section>

	<!--container--->
	<section class="container">
		<div class="text">
			<h2>Start Your Vacation <br> with Lots of Services!</h2>
		</div>

		<div class="row-items" id="service-list"></div>
	</section>

	<!--Package section--->
	<section class="package" id="package">
		<div class="title">
			<h2>Our Upcoming <br> Tour Package</h2>
		
		</div>
			

		<div class="package-content" id="package-list"></div>
	</section>

	<!--destination section--->
	<section class="destination" id="destination">
		<div class="title">
			<h2>Our Most Popular <br> Destination!</h2>
		</div>

		<div class="destination-content" id="destination-list"></div>
	</section>



	<!--footer--->
	<section id="contact">
			<div class="footer">
				<div class="main">
					<div id="footer-lists" class="main-content"></div>
					<div class="list">
					<h4>Connect</h4>
					<div class="social">
						<a href="#"><i class='bx bxl-facebook' ></i></a>
						<a href="#"><i class='bx bxl-instagram-alt' ></i></a>
						<a href="#"><i class='bx bxl-twitter' ></i></a>
						<a href="#"><i class='bx bxl-linkedin' ></i></a>
					</div>
				</div>
			</div>
		</div>
	</section>

	<template id="service-card-template">
		<div class="container-box">
			<div class="container-img">
				<img src="" alt="">
			</div>
			<h4></h4>
			<p></p>
		</div>
	</template>

	<template id="package-card-template">
		<div class="box">
			<div class="thum">
				<img src="" alt="">
				<h3></h3>
			</div>
			<div class="dest-content">
				<div class="location">
					<h4></h4>
					<p></p>
				</div>
				<div class="stars"></div>
			</div>
		</div>
	</template>

	<template id="destination-card-template">
		<div class="col-content">
			<img src="" alt="">
			<h5></h5>
			<p></p>
		</div>
	</template>

	<template id="footer-list-template">
		<div class="list">
			<h4></h4>
			<ul></ul>
		</div>
	</template>

	<script src="dom-utils.js"></script>
	<script src="travel.js"></script>
</body>
</html>
